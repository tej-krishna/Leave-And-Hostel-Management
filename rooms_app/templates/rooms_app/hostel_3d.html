<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hostel Layout Model</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Orbit Controls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>
// This standalone 3D view has no chrome/navigation of its own (it isn't
// linked from the redesigned sidebar - room_selection.html's embedded
// picker supersedes it) so it isn't wrapped in the app shell. It still
// respects the user's saved theme choice for its background, so a direct
// visit doesn't flash bright white against a dark preference.
let hms3dIsDark = false;
try {
    const pref = localStorage.getItem('hms-theme');
    hms3dIsDark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
} catch (e) {}
if (hms3dIsDark) document.body.style.background = '#0d1117';

const scene = new THREE.Scene();
scene.background = new THREE.Color(hms3dIsDark ? 0x0d1117 : 0xffffff);

/* =====================================
   CAMERA
===================================== */
const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(35, 20, 35);

/* =====================================
   RENDERER
===================================== */
const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* =====================================
   CONTROLS
===================================== */
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.maxPolarAngle = Math.PI / 2.1;
controls.minDistance = 2;
controls.maxDistance = 150;
controls.enablePan = false;

/* =====================================
   LIGHTING
===================================== */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
light1.position.set(10, 20, 10);
light1.castShadow = true;
scene.add(light1);

const light2 = new THREE.PointLight(0xe0f7fa, 0.5);
light2.position.set(-10, 10, -10);
scene.add(light2);

/* =====================================
   GROUND
===================================== */
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.1,
    metalness: 0.1
});

const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(
    100,
    80,
    0x00bcd4,
    0xf0f0f0
);

grid.material.opacity = 0.2;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

/* =====================================
   CLICK SUPPORT
===================================== */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

/* =====================================
   BUILDING FUNCTION
   (ORIGINAL SHAPE KEPT EXACTLY)
===================================== */
function createBuilding(x, z, hostelName) {
    const group = new THREE.Group();

    // store hostel name for click popup
    group.userData.hostelName = hostelName;

    const floorH = 1.6;
    const totalH = floorH * 4;
    const wingW = 1.2;
    const centerW = 2.0;
    const totalW = centerW + (wingW * 4);
    const h = totalH;
    const thick = 0.8;

    const matYellow = new THREE.MeshStandardMaterial({
        color: 0xffd54f,
        roughness: 0.5,
        metalness: 0.1
    });

    const matCream = new THREE.MeshStandardMaterial({
        color: 0xf5f5f5,
        roughness: 0.5,
        metalness: 0.1
    });

    const matBase = new THREE.MeshStandardMaterial({
        color: 0x9e9e9e
    });

    const matWindow = new THREE.MeshBasicMaterial({
        color: 0x212121
    });

    const matPlant = new THREE.MeshStandardMaterial({
        color: 0x2e7d32
    });

    function createRoundedBox(w, h, d, radius, colorMat) {
        const shape = new THREE.Shape();
        const eps = 0.0001;
        const width = w / 2;
        const height = h / 2;

        radius = Math.min(radius, width - eps, height - eps);

        shape.moveTo(-width + radius, -height);
        shape.lineTo(width - radius, -height);
        shape.absarc(
            width - radius,
            -height + radius,
            radius,
            -Math.PI / 2,
            0,
            false
        );

        shape.lineTo(width, height - radius);

        shape.absarc(
            width - radius,
            height - radius,
            radius,
            0,
            Math.PI / 2,
            false
        );

        shape.lineTo(-width + radius, height);

        shape.absarc(
            -width + radius,
            height - radius,
            radius,
            Math.PI / 2,
            Math.PI,
            false
        );

        shape.lineTo(-width, -height + radius);

        shape.absarc(
            -width + radius,
            -height + radius,
            radius,
            Math.PI,
            Math.PI * 1.5,
            false
        );

        const settings = {
            depth: d,
            bevelEnabled: false
        };

        const geo = new THREE.ExtrudeGeometry(shape, settings);
        geo.center();

        const mesh = new THREE.Mesh(geo, colorMat);
        mesh.rotation.x = Math.PI / 2;

        return mesh;
    }

    function createFacade(isConnector = false) {
        const facadeGroup = new THREE.Group();
        const fThick = isConnector ? thick * 0.8 : thick;

        function addPart(width, colorMat, px) {
            const part = createRoundedBox(
                width,
                fThick,
                h,
                0.08,
                colorMat
            );

            part.position.set(px, h / 2, 0);
            part.castShadow = true;
            part.receiveShadow = true;
            facadeGroup.add(part);

            if (width < centerW + 0.1 || isConnector) {
                const winGeo = new THREE.PlaneGeometry(0.35, 0.45);

                for (let f = 0; f < 4; f++) {
                    const yPos = (f * floorH) + floorH / 2;

                    for (let i = -1; i <= 1; i++) {
                        const xOffset = i * (width / 3.5);

                        const winFront = new THREE.Mesh(
                            winGeo,
                            matWindow
                        );

                        winFront.position.set(
                            px + xOffset,
                            yPos,
                            fThick / 2 + 0.01
                        );

                        facadeGroup.add(winFront);

                        const winBack = new THREE.Mesh(
                            winGeo,
                            matWindow
                        );

                        winBack.position.set(
                            px + xOffset,
                            yPos,
                            -fThick / 2 - 0.01
                        );

                        winBack.rotation.y = Math.PI;
                        facadeGroup.add(winBack);
                    }
                }
            } else {
                const doorGeo = new THREE.PlaneGeometry(1.0, 1.2);
                const door = new THREE.Mesh(
                    doorGeo,
                    matWindow
                );

                door.position.set(
                    px,
                    0.8,
                    fThick / 2 + 0.01
                );

                facadeGroup.add(door);
            }
        }

        addPart(centerW, matYellow, 0);
        addPart(
            wingW,
            matCream,
            -centerW / 2 - wingW / 2
        );

        addPart(
            wingW,
            matCream,
            centerW / 2 + wingW / 2
        );

        addPart(
            wingW,
            matYellow,
            -centerW / 2 - wingW * 1.5
        );

        addPart(
            wingW,
            matYellow,
            centerW / 2 + wingW * 1.5
        );

        return facadeGroup;
    }

    const facadeOffset = (totalW / 2) + thick / 8;

    const front = createFacade();
    front.position.z = facadeOffset;
    group.add(front);

    const back = createFacade();
    back.position.z = -facadeOffset;
    back.rotation.y = Math.PI;
    group.add(back);

    const left = createFacade();
    left.position.x = -facadeOffset;
    left.rotation.y = -Math.PI / 2;
    group.add(left);

    const right = createFacade();
    right.position.x = facadeOffset;
    right.rotation.y = Math.PI / 2;
    group.add(right);

    const middleWing = createFacade(true);
    group.add(middleWing);

    const baseSize = totalW + thick + 1.2;

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(
            baseSize,
            0.2,
            baseSize
        ),
        matBase
    );

    base.position.y = 0.1;
    group.add(base);

    const plantGeo = new THREE.SphereGeometry(
        0.25,
        6,
        6
    );

    [facadeOffset, -facadeOffset].forEach(zPos => {
        const steps = new THREE.Mesh(
            new THREE.BoxGeometry(1.5, 0.15, 0.8),
            matBase
        );

        steps.position.set(
            0,
            0.07,
            zPos + (zPos > 0 ? 0.4 : -0.4)
        );

        group.add(steps);

        for (
            let xPos = -totalW / 2;
            xPos <= totalW / 2;
            xPos += 0.8
        ) {
            if (Math.abs(xPos) > 0.8) {
                const p = new THREE.Mesh(
                    plantGeo,
                    matPlant
                );

                p.position.set(
                    xPos,
                    0.3,
                    zPos + (zPos > 0 ? 0.3 : -0.3)
                );

                group.add(p);
            }
        }
    });

    group.position.set(x, 0, z);
    scene.add(group);
}

/* =====================================
   HOSTELS WITH NAMES
===================================== */

const spacing = 5.0;

const hostels = [
    { name: "I1", pos: [-4, -2] },
    { name: "I2", pos: [-2, -2] },

    { name: "I3", pos: [-4, 0] },

    { name: "K2", pos: [0, 0] },
    { name: "K3", pos: [2, 0] },
    { name: "K4", pos: [4, 0] }
];

hostels.forEach(hostel => {
    createBuilding(
        hostel.pos[0] * spacing,
        hostel.pos[1] * spacing,
        hostel.name
    );
});

/* =====================================
   CLICK EVENT -> POPUP
===================================== */

renderer.domElement.addEventListener("dblclick", (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(
        scene.children,
        true
    );

    if (intersects.length > 0) {
        let obj = intersects[0].object;

        while (
            obj.parent &&
            !obj.userData.hostelName
        ) {
            obj = obj.parent;
        }

        if (obj.userData.hostelName) {
            alert(
                "Hostel Name: " +
                obj.userData.hostelName
            );
        }
    }
});

/* =====================================
   ANIMATION
===================================== */

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

animate();

/* =====================================
   RESIZE
===================================== */

window.addEventListener("resize", () => {
    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
</script>

</body>
</html>
