{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Hostel Ops</title>
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('hms-theme');
                if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>

{% if messages %}
<script id="django-messages-data" type="application/json">
[{% for message in messages %}{"tags": "{{ message.tags|escapejs }}", "text": "{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}]
</script>
{% endif %}

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="sidebar-brand-mark" style="width:44px;height:44px;font-size:1.1rem;">H</div>
            <div class="auth-title">Hostel Ops</div>
            <div class="auth-subtitle">Sign in with your Student ID and Name to continue.</div>
        </div>

        <form method="post" action="{% url 'perform_login' %}" novalidate>
            {% csrf_token %}
            <div class="field">
                <label class="field-label" for="student_id">Student ID</label>
                <input class="input" type="text" id="student_id" name="student_id" placeholder="e.g. N210190" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label class="field-label" for="name">Full Name</label>
                <input class="input" type="text" id="name" name="name" placeholder="As registered" autocomplete="name" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <span class="spinner"></span><span class="btn-label-text">Sign in</span>
            </button>
        </form>

        {% if request.session.student_pk %}
        <p class="text-sm text-muted mt-4" style="text-align:center;">
            Signed in as <strong>{{ request.session.student_name }}</strong> &middot;
            <a href="{% url 'logout' %}">Sign out</a>
        </p>
        {% endif %}
    </div>

    <div style="position:fixed; top:20px; right:20px;">
        <div class="theme-toggle" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light">{% include 'hostel_app/partials/icon.html' with name='sun' %}</button>
            <button type="button" data-theme-choice="system" aria-label="System theme" title="System">{% include 'hostel_app/partials/icon.html' with name='monitor' %}</button>
            <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark">{% include 'hostel_app/partials/icon.html' with name='moon' %}</button>
        </div>
    </div>
</div>

<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
